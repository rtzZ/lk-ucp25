name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          export DATABASE_URL="sqlite+aiosqlite:///$GITHUB_WORKSPACE/e2e-seed.db"
          export SEED_DEMO="1"
          export AUTH_DEV_MODE="1"
          export FRONTEND_URL="http://localhost:5173"
          export SKIP_SCHEDULER="1"
          nohup python -m uvicorn app.main:app --port 8001 > backend.log 2>&1 &
          echo $! > backend.pid
        working-directory: backend
      - run: |
          export VITE_API_URL="http://localhost:8001"
          nohup ./node_modules/.bin/vite --port 5173 --strictPort > vite.log 2>&1 &
          echo $! > vite.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 2
          done
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: kill $(cat backend/backend.pid) $(cat frontend/vite.pid) 2>/dev/null || true
        if: always()

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose читает env_file: .env, а он в .gitignore — берём пример.
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker build ./backend
