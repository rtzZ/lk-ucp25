[project]
name = "lk-backend"
version = "0.1.0"
description = "Электронный кабинет студента: backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "loguru>=0.7",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "playwright>=1.40",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
